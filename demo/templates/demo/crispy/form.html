{% extends "admin/base_site.html" %}

{% load crispy_forms_tags i18n unfold %}

{% block extrahead %}
    {{ block.super }}
    <script src="{% url 'admin:jsi18n' %}"></script>
    {{ form.media }}
{% endblock %}

{% block content %}
    <div class="flex flex-col gap-8">
        {% if helper %}
            {% crispy form helper "unfold_crispy" %}
        {% else %}
            {% crispy form "unfold_crispy" %}
        {% endif %}
    </div>
{% endblock %}
