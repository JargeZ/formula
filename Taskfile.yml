version: "3"

env:
  DEBUG: "1"
  ALLOWED_HOSTS: localhost,127.0.0.1

tasks:
  install:
    desc: Install Python and Node dependencies
    cmds:
      - poetry install --no-root
      - npm ci
    sources:
      - poetry.lock
      - package-lock.json

  css:
    desc: Build Tailwind styles
    cmds:
      - npm run tailwind:build

  seed:
    desc: Create the database and load sample data (login demo/demo)
    cmds:
      - poetry run python manage.py migrate --noinput
      - poetry run python manage.py loaddata formula/fixtures/*
    status:
      - test -f database.sqlite

  start:
    desc: Run the development server
    cmds:
      - poetry run python manage.py migrate --noinput
      - poetry run python manage.py runserver {{.CLI_ARGS | default "127.0.0.1:8000"}}

  run:
    desc: Install, seed and start the project
    cmds:
      - task: install
      - task: css
      - task: seed
      - task: start

  demo:create:
    desc: Create the Fly app (once)
    cmds:
      - fly apps create django-formula-admin-agentic --org personal
    status:
      - fly status >/dev/null 2>&1

  demo:secrets:
    desc: Set a stable SECRET_KEY on Fly (once)
    deps: [demo:create]
    cmds:
      - fly secrets set --stage SECRET_KEY="$(openssl rand -hex 32)"
    status:
      - fly secrets list | grep -q SECRET_KEY

  demo:build:
    desc: Build the Fly image locally to check it
    cmds:
      - docker build -f fly.Dockerfile -t formula-demo .
      - docker image ls formula-demo

  demo:deploy:
    desc: Deploy the read-only demo to Fly (single machine, scale to zero)
    deps: [demo:secrets]
    cmds:
      - fly deploy --ha=false
      - fly scale count 1 --yes
