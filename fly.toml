# See https://fly.io/docs/reference/configuration/
app = 'django-formula-admin-agentic'
primary_region = 'ams'
console_command = '/code/manage.py shell'

[build]
  dockerfile = 'fly.Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  DATABASE_READONLY = '1'
  ALLOWED_HOSTS = 'django-formula-admin-agentic.fly.dev'
  CSRF_TRUSTED_ORIGINS = 'https://django-formula-admin-agentic.fly.dev'
  LOGIN_USERNAME = 'demo'
  LOGIN_PASSWORD = 'demo'
  # Fly terminates TLS; MCP OAuth needs the original https scheme.
  SECURE_PROXY_SSL_HEADER = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
